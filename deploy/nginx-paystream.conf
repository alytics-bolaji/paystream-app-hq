# Nginx serves the frontend and proxies the API, so the browser only ever
# talks to one origin. Lives at /etc/nginx/sites-available/paystream.
server {
    listen 80 default_server;
    server_name _;

    # the static frontend (index.html, app.js, styles.css, config.js)
    root /var/www/paystream;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/wallet/1  ->  http://127.0.0.1:3000/wallet/1
    # the trailing slash on proxy_pass strips the /api/ prefix
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
