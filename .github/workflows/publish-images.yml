name: publish-images
# Build the frontend and backend images and push them to Docker Hub.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token (Account -> Security -> New Access Token)
on:
  push:
    tags: ['v*']          # publish on a version tag, e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch: {}   # ...or run it by hand from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push the backend image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/paystream-backend"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

      - name: Build and push the frontend image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/paystream-frontend"
          docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" ./frontend
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
