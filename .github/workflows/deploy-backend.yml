name: Deploy backend
 
on:
  push:
    branches: [ main ]
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build the artifact
        working-directory: backend
        run: |
          npm ci --omit=dev
          zip -rq ../backend.zip . -x '*.env' 'tests/*'
      - name: Write the SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 400 key.pem
      - name: Copy the artifact to the box
        run: |
          scp -o StrictHostKeyChecking=no -i key.pem backend.zip \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/backend.zip
      - name: Release and restart (with rollback)
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo bash -s' < deploy/deploy-backend-remote.sh

