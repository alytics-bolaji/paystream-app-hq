# The frontend. Replicas and image from values. ClusterIP Service behind the Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-web
  labels:
    app: paystream-web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app: paystream-web
  template:
    metadata:
      labels:
        app: paystream-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-web
spec:
  selector:
    app: paystream-web
  ports:
    - port: 80
      targetPort: 80
