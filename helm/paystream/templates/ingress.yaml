# The front door. The host name comes from values (paystream.local in dev,
# paystream.ke in prod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paystream
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paystream-web
                port:
                  number: 80
