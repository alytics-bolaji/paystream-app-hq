# Credentials. base64 is encoding, not encryption -- in prod pass the password
# with --set db.password=... or source it from a real secrets manager (Week 18).
apiVersion: v1
kind: Secret
metadata:
  name: paystream-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  DATABASE_URL: "postgres://{{ .Values.db.user }}:{{ .Values.db.password }}@paystream-postgres:5432/{{ .Values.db.name }}"
