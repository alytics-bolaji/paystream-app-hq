# frontend/nginx.conf -- the web-server config used INSIDE the frontend container.
# It serves the static files AND proxies /api to the backend container by name
# (paystream-api) on the shared network. In production on EC2 the proxy instead
# points at 127.0.0.1:3000 (see deploy/nginx-paystream.conf); this is the
# containerised equivalent.
server {                                       # defines one virtual server (one site this Nginx serves)
    listen 80;                                 # accept HTTP connections on port 80 inside the container
    server_name _;                             # "_" matches any hostname (no name-based routing needed here)
    root /usr/share/nginx/html;                # serve files from this folder (where the Dockerfile copied the UI)
    index index.html;                          # when a directory is requested, serve index.html from it

    location / {                               # rule for all normal page/asset requests
        try_files $uri $uri/ /index.html;      # serve the file if it exists, else the folder, else fall back to index.html
    }

    # Example: a browser request for /api/wallet/1 is forwarded to http://paystream-api:3000/wallet/1
    location /api/ {                           # rule for any request whose path starts with /api/
        proxy_pass http://paystream-api:3000/; # forward it to the API container; the trailing "/" strips the /api prefix
        proxy_set_header Host $host;           # pass the browser's original Host header through to the API
        proxy_set_header X-Real-IP $remote_addr;                      # tell the API the real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # append this proxy hop to the forwarding chain
    }
}                                              # end of the server block
