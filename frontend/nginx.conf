# frontend/nginx.conf -- used INSIDE the frontend container image.
# Serves the static files and proxies /api to the BACKEND CONTAINER by name
# (paystream-api) on the shared Docker network. In production on EC2 the proxy
# instead points at 127.0.0.1:3000 (see deploy/nginx-paystream.conf); this file
# is the containerised equivalent.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/wallet/1 -> http://paystream-api:3000/wallet/1
    location /api/ {
        proxy_pass http://paystream-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
