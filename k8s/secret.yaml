# secret.yaml -- the database credentials, kept OUT of the other files.
# IMPORTANT: base64 is ENCODING, not encryption. A real secret is created
# out-of-band (kubectl create secret) and NEVER committed to git. This file is
# a placeholder so the lab is reproducible; Week 18 moves it to a real manager.
apiVersion: v1                            # core API, version v1 (Secret is a core object)
kind: Secret                              # the object type: a Secret (for sensitive values)
metadata:                                 # identifying information for this object
  name: paystream-secrets                 # the name other files use to reference this Secret
type: Opaque                              # "Opaque" = an ordinary user-defined secret (the general-purpose type)
stringData:                               # values written in plain text here; Kubernetes base64-encodes them on create
  POSTGRES_PASSWORD: paystream            # the database password, read by the Postgres pod
  DATABASE_URL: postgres://paystream:paystream@paystream-postgres:5432/paystream  # full connection string (holds the password), read by the API
