# Secret: the database credentials, kept OUT of the pod specs and the ConfigMap.
# stringData lets you write plain values; Kubernetes stores them base64-encoded.
#
# IMPORTANT: base64 is ENCODING, not encryption. A Secret committed to git is
# still readable by anyone who has the file. In real life you create the Secret
# out-of-band (kubectl create secret ...) or from an external manager, and you
# do NOT commit it. This file is in the repo only so the lab is reproducible;
# Week 18 moves it to AWS Secrets Manager. Treat it as a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: paystream-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: paystream
  DATABASE_URL: postgres://paystream:paystream@paystream-postgres:5432/paystream
