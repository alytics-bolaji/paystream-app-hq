# PostgreSQL as a Deployment + Service.
# NOTE: no persistent volume here, so data is lost if the pod restarts.
# Week 13 adds a PersistentVolumeClaim. The password is in plain text for now;
# Week 13 moves it into a Secret (that is the Week 13 incident, on purpose).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-postgres
  labels:
    app: paystream-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paystream-postgres
  template:
    metadata:
      labels:
        app: paystream-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: paystream
            - name: POSTGRES_PASSWORD
              value: paystream
            - name: POSTGRES_DB
              value: paystream
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "paystream"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-postgres
spec:
  selector:
    app: paystream-postgres
  ports:
    - port: 5432
      targetPort: 5432
