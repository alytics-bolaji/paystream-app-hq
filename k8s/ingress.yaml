# ingress.yaml -- one clean HTTP front door for the app, replacing the raw NodePort.
# On Minikube, first turn on the controller and map the host once:
#   minikube addons enable ingress
#   echo "$(minikube ip) paystream.local" | sudo tee -a /etc/hosts
# then open http://paystream.local
apiVersion: networking.k8s.io/v1          # Ingress lives in the "networking.k8s.io" API group, version v1
kind: Ingress                             # object type: an Ingress (HTTP routing into the cluster)
metadata:                                 # identifying information for the Ingress
  name: paystream                         # the Ingress's name
spec:                                     # the routing rules
  rules:                                  # the list of host/path rules
    - host: paystream.local               # requests for this host name are matched by this rule
      http:                               # HTTP routing for that host
        paths:                            # the list of URL paths to route
          - path: /                       # match every path starting at /
            pathType: Prefix              # "Prefix" = match / and everything under it
            backend:                      # where matching requests are sent
              service:                    # ...to a Service
                name: paystream-web       # the Service name to route to
                port:                     # which port on that Service
                  number: 80              # port 80 (the frontend Service)
