# The Paystream frontend (Nginx) as a Deployment (2 replicas) + NodePort Service.
# Build and load like the API:
#   docker build -t paystream-frontend:v2 ./frontend
#   minikube image load paystream-frontend:v2
# Nginx inside the image proxies /api to the paystream-api Service by name.
# A NodePort exposes the app to your machine; reach it with:
#   minikube service paystream-web --url
# (Ingress comes in Week 13.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-web
  labels:
    app: paystream-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paystream-web
  template:
    metadata:
      labels:
        app: paystream-web
    spec:
      containers:
        - name: web
          image: paystream-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-web
spec:
  type: NodePort
  selector:
    app: paystream-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
