# The Paystream frontend (Nginx) as a Deployment (2 replicas) + Service.
# Week 13: the Service is now ClusterIP, because the Ingress (ingress.yaml) is
# the front door. Nginx inside the image still proxies /api to paystream-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-web
  labels:
    app: paystream-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paystream-web
  template:
    metadata:
      labels:
        app: paystream-web
    spec:
      containers:
        - name: web
          image: paystream-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-web
spec:
  selector:
    app: paystream-web
  ports:
    - port: 80
      targetPort: 80
