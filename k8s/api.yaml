# The Paystream wallet API as a Deployment (2 replicas) + Service.
# Images are built locally and loaded into minikube:
#   docker build -t paystream-backend:v2 ./backend
#   minikube image load paystream-backend:v2
# Week 13: configuration now comes from the ConfigMap, and the one value that
# carries a password (DATABASE_URL) comes from the Secret -- nothing sensitive
# or environment-specific is hard-coded in this file any more.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-api
  labels:
    app: paystream-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paystream-api
  template:
    metadata:
      labels:
        app: paystream-api
    spec:
      containers:
        - name: api
          image: paystream-backend:v2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: paystream-config     # PORT, REDIS_URL, CACHE_TTL, CORS_ORIGIN
          env:
            - name: DATABASE_URL           # the only value with a password -> from the Secret
              valueFrom:
                secretKeyRef:
                  name: paystream-secrets
                  key: DATABASE_URL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-api
spec:
  selector:
    app: paystream-api
  ports:
    - port: 3000
      targetPort: 3000
