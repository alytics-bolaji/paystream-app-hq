# Redis as a Deployment + Service. A cache is disposable, so no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paystream-redis
  labels:
    app: paystream-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paystream-redis
  template:
    metadata:
      labels:
        app: paystream-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: paystream-redis
spec:
  selector:
    app: paystream-redis
  ports:
    - port: 6379
      targetPort: 6379
