# redis.yaml -- the cache: a Deployment that runs Redis, and a Service to reach it.
# A cache is disposable, so there is no volume here.
apiVersion: apps/v1                       # Deployments live in the "apps" API group, version v1
kind: Deployment                          # object type: a Deployment (keeps a set of identical pods running)
metadata:                                 # identifying information for the Deployment
  name: paystream-redis                   # the Deployment's name
  labels:                                 # key/value tags attached to the Deployment object itself
    app: paystream-redis                  # a label marking this as the redis app
spec:                                     # the desired state of the Deployment
  replicas: 1                             # run exactly one Redis pod
  selector:                               # how the Deployment knows which pods are its own
    matchLabels:                          # it owns pods whose labels match these
      app: paystream-redis                # ...pods labelled app=paystream-redis
  template:                               # the blueprint for the pods this Deployment creates
    metadata:                             # metadata applied to each created pod
      labels:                             # labels stamped onto each pod
        app: paystream-redis              # must match the selector above so the Deployment claims these pods
    spec:                                 # the pod's specification
      containers:                         # the list of containers in the pod
        - name: redis                     # a name for this container within the pod
          image: redis:7                  # the image to run: official Redis, version 7
          ports:                          # ports the container exposes
            - containerPort: 6379         # Redis listens on 6379 inside the pod
          readinessProbe:                 # how Kubernetes checks the pod is ready for traffic
            exec:                         # run a command inside the container to check
              command: ["redis-cli", "ping"]  # redis-cli ping returns PONG when Redis is up
            initialDelaySeconds: 3        # wait 3s after the container starts before the first check
            periodSeconds: 5              # then run the check every 5s
---                                       # '---' separates the two objects defined in this one file
apiVersion: v1                            # Services are core objects, version v1
kind: Service                             # object type: a Service (a stable name + load balancing over pods)
metadata:                                 # identifying information for the Service
  name: paystream-redis                   # the Service name = the DNS hostname other pods use ("paystream-redis")
spec:                                     # the Service's desired behaviour
  selector:                               # which pods this Service sends traffic to
    app: paystream-redis                  # ...pods labelled app=paystream-redis
  ports:                                  # the ports the Service exposes
    - port: 6379                          # the port the Service itself listens on
      targetPort: 6379                    # the port on the pod to forward that traffic to
